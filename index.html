<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Aly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050906;
    --surface: #070d09;
    --border: rgba(30,80,48,0.22);
    --emerald: #0f4a2a;
    --emerald-mid: #165e36;
    --emerald-deep: #0a3320;
    --gold: #a07830;
    --text: #c8ddd0;
    --text-muted: #5a8a6e;
    --text-faint: #1e3d2a;
    --font-display: "Cormorant Garamond", Georgia, serif;
    --font-body: "EB Garamond", Georgia, serif;
  }

  html {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem 4rem;
    background:
      radial-gradient(ellipse 70% 50% at 15% 15%, rgba(15,74,42,0.09) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 85% 85%, rgba(80,50,110,0.06) 0%, transparent 60%),
      var(--bg);
  }

  .envelope-wrapper {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3.5rem;
  }

  .envelope {
    position: relative;
    width: 100%;
    aspect-ratio: 1.618 / 1;
    background: linear-gradient(150deg, #0a160d 0%, #070e09 55%, #09130b 100%);
    border: 1px solid rgba(20,60,35,0.35);
    border-radius: 3px;
    cursor: pointer;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    box-shadow: 0 8px 40px rgba(0,0,0,0.75), 0 0 0 1px rgba(15,74,42,0.05), inset 0 1px 0 rgba(255,255,255,0.02);
    overflow: hidden;
  }

  .envelope:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 35px rgba(15,74,42,0.1), 0 0 0 1px rgba(20,60,35,0.18);
  }

  .envelope::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent calc(50% - 1px), rgba(20,70,40,0.09) calc(50% - 1px), rgba(20,70,40,0.09) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(225deg, transparent calc(50% - 1px), rgba(20,70,40,0.09) calc(50% - 1px), rgba(20,70,40,0.09) calc(50% + 1px), transparent calc(50% + 1px));
    pointer-events: none;
  }

  .envelope::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 55% at 50% 0%, rgba(15,74,42,0.07) 0%, transparent 65%);
    pointer-events: none;
  }

  .seal-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    transition: transform 0.35s ease, filter 0.35s ease;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.7)) drop-shadow(0 0 22px rgba(15,74,42,0.4));
  }

  .envelope:hover .seal-wrap {
    transform: translate(-50%, -50%) scale(1.06);
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.7)) drop-shadow(0 0 32px rgba(15,74,42,0.55));
  }

  .seal-svg { width: 88px; height: 88px; }

  .envelope-address {
    position: absolute;
    bottom: 1.8rem;
    left: 2.2rem;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    line-height: 1.4;
    z-index: 2;
  }
  .envelope-address .aly { display: block; font-size: 1.1rem; color: rgba(140,195,165,0.6); }
  .envelope-address .date { display: block; font-size: 0.76rem; color: var(--text-faint); letter-spacing: 0.1em; font-style: normal; text-transform: uppercase; margin-top: 0.1rem; }

  .postmark {
    position: absolute;
    top: 1.4rem; right: 1.8rem;
    width: 50px; height: 50px;
    border: 1.5px solid rgba(20,60,35,0.25);
    border-radius: 50%;
    display: flex;
    align-items: center; justify-content: center;
    z-index: 2;
  }
  .postmark::before, .postmark::after { content: ""; position: absolute; left: -8px; right: -8px; height: 1px; background: rgba(20,60,35,0.18); }
  .postmark::before { top: 30%; }
  .postmark::after  { top: 70%; }
  .postmark-inner { font-family: var(--font-display); font-size: 0.58rem; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; line-height: 1.4; }

  .envelope-hint { font-family: var(--font-display); font-size: 0.76rem; color: var(--text-faint); letter-spacing: 0.16em; text-transform: uppercase; transition: color 0.3s ease; margin-top: -1rem; }
  .envelope-wrapper:hover .envelope-hint { color: var(--text-muted); }

  /* LETTER */
  .letter-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2,6,3,0.96);
    z-index: 100;
    overflow-y: auto;
    padding: 3rem 1.5rem 5rem;
  }
  .letter-overlay.open {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    animation: fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .letter-page {
    width: 100%;
    max-width: 600px;
    background: linear-gradient(160deg, #f0ede4 0%, #ede9df 40%, #e8e3d7 100%);
    color: #1a1a14;
    padding: clamp(2.5rem, 6vw, 4.5rem);
    border-radius: 2px;
    box-shadow: 0 28px 90px rgba(0,0,0,0.9), 0 4px 20px rgba(0,0,0,0.5);
    animation: slideUp 0.65s cubic-bezier(0.16,1,0.3,1) forwards;
    position: relative;
    overflow: hidden;
  }
  .letter-page::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 40% at 90% 10%, rgba(15,74,42,0.04) 0%, transparent 60%), radial-gradient(ellipse 50% 50% at 10% 90%, rgba(80,50,110,0.03) 0%, transparent 60%);
    pointer-events: none;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .letter-inner-border { position: absolute; inset: 14px; border: 1px solid rgba(15,74,42,0.13); pointer-events: none; border-radius: 1px; z-index: 1; }
  .corner { position: absolute; width: 22px; height: 22px; z-index: 2; }
  .corner-tl { top:14px;left:14px; border-top:1.5px solid rgba(15,74,42,0.25); border-left:1.5px solid rgba(15,74,42,0.25); }
  .corner-tr { top:14px;right:14px; border-top:1.5px solid rgba(15,74,42,0.25); border-right:1.5px solid rgba(15,74,42,0.25); }
  .corner-bl { bottom:14px;left:14px; border-bottom:1.5px solid rgba(15,74,42,0.25); border-left:1.5px solid rgba(15,74,42,0.25); }
  .corner-br { bottom:14px;right:14px; border-bottom:1.5px solid rgba(15,74,42,0.25); border-right:1.5px solid rgba(15,74,42,0.25); }
  .corner::before { content:""; position:absolute; width:5px; height:5px; background:radial-gradient(circle, rgba(15,74,42,0.5), rgba(15,74,42,0.15)); border-radius:50%; }
  .corner-tl::before{top:-3px;left:-3px;} .corner-tr::before{top:-3px;right:-3px;}
  .corner-bl::before{bottom:-3px;left:-3px;} .corner-br::before{bottom:-3px;right:-3px;}

  .letter-content { position: relative; z-index: 3; }

  .letter-date { font-family: var(--font-display); font-size: 0.8rem; color: rgba(20,60,35,0.4); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2.2rem; display: block; }
  .letter-salutation { font-family: var(--font-display); font-size: clamp(1.5rem,3.5vw,2.1rem); font-style: italic; font-weight: 300; color: #0a3020; margin-bottom: 1.8rem; line-height: 1.3; }

  .letter-body { font-family: var(--font-body); font-size: clamp(1rem,1.8vw,1.08rem); line-height: 1.92; color: #2a2820; min-height: 2em; }
  .letter-body p { margin-bottom: 1.4rem; text-wrap: pretty; }
  .letter-body p:last-of-type { margin-bottom: 2.6rem; }
  .letter-body p.drop-cap::first-letter { font-family: var(--font-display); font-size: 3.1em; font-style: italic; float: left; line-height: 0.76; margin: 0.1em 0.08em 0 0; color: #0a3020; }

  .cursor { display: inline-block; width: 2px; height: 1.1em; background: #0f4a2a; margin-left: 2px; vertical-align: text-bottom; animation: blink 0.75s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .cursor.hidden { display: none; }

  .letter-closing { font-family: var(--font-display); font-size: clamp(1rem,2vw,1.15rem); font-style: italic; color: #1a1612; line-height: 1.6; opacity: 0; transform: translateY(8px); transition: opacity 0.8s ease, transform 0.8s ease; }
  .letter-closing.visible { opacity:1; transform:translateY(0); }
  .letter-closing .name { font-size: clamp(1.4rem,3vw,1.75rem); font-weight: 300; display: block; margin-top: 0.2rem; color: #0a3020; }

  /* Divider */
  .letter-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(15,74,42,0.3), transparent);
    margin: 2rem auto;
    opacity: 0;
    transition: opacity 1s ease 0.4s;
  }
  .letter-divider.visible { opacity: 1; }

  /* Spotify button */
  .spotify-wrap {
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease 0.6s, transform 1s ease 0.6s;
  }
  .spotify-wrap.visible { opacity: 1; transform: translateY(0); }

  .spotify-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.65rem 1.4rem;
    background: transparent;
    border: 1px solid rgba(15,74,42,0.35);
    border-radius: 2px;
    color: rgba(20,60,35,0.7);
    font-family: var(--font-display);
    font-size: 0.85rem;
    font-style: italic;
    letter-spacing: 0.08em;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .spotify-btn:hover {
    background: rgba(15,74,42,0.07);
    border-color: rgba(15,74,42,0.55);
    color: rgba(15,60,30,0.95);
  }
  .spotify-btn svg { flex-shrink: 0; }

  .spotify-label {
    display: block;
    font-family: var(--font-display);
    font-size: 0.72rem;
    font-style: normal;
    color: rgba(20,60,35,0.35);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 0.6rem;
  }

  .close-btn {
    position: fixed;
    top: 1.25rem; right: 1.25rem;
    width: 44px; height: 44px;
    display: flex;
    align-items: center; justify-content: center;
    background: rgba(15,74,42,0.1);
    border: 1px solid rgba(15,74,42,0.22);
    border-radius: 50%;
    color: rgba(140,195,165,0.4);
    font-size: 1.1rem;
    cursor: pointer;
    z-index: 200;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
  }
  .close-btn:hover { background: rgba(15,74,42,0.2); color: rgba(140,195,165,0.85); border-color: rgba(15,74,42,0.4); }

  .particles { position:fixed; inset:0; pointer-events:none; z-index:99; overflow:hidden; }
  .particle { position:absolute; bottom:-20px; opacity:0; animation:floatUp var(--dur,4s) ease-in forwards; animation-delay:var(--delay,0s); }
  @keyframes floatUp { 0%{opacity:0;transform:translateY(0) rotate(0deg) scale(0.4)} 10%{opacity:0.6} 80%{opacity:0.15} 100%{opacity:0;transform:translateY(-105vh) rotate(360deg) scale(1.1)} }

  @media (max-width:480px) { .letter-inner-border,.corner,.postmark{display:none} }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="envelope-wrapper">
  <div class="envelope" id="envelope" onclick="openLetter()" role="button" tabindex="0" aria-label="Open love letter for Aly">
    <div class="seal-wrap">
      <svg class="seal-svg" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="heartGrad" cx="38%" cy="30%" r="70%" fx="36%" fy="26%">
            <stop offset="0%"   stop-color="#2a6644"/>
            <stop offset="35%"  stop-color="#165e36"/>
            <stop offset="70%"  stop-color="#0d4828"/>
            <stop offset="100%" stop-color="#072814"/>
          </radialGradient>
          <radialGradient id="heartShine" cx="32%" cy="25%" r="42%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <radialGradient id="dripGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#165e36"/>
            <stop offset="60%"  stop-color="#0d4828"/>
            <stop offset="100%" stop-color="#072814"/>
          </radialGradient>
        </defs>
        <path d="M44 8 C50 6,60 7,66 12 C72 17,76 20,79 26 C83 34,83 40,82 47 C81 54,78 60,74 65 C70 70,65 75,60 78 C55 81,50 83,44 83 C38 83,33 81,28 78 C23 75,18 70,14 65 C10 60,7 54,6 47 C5 40,5 34,9 26 C12 20,16 17,22 12 C28 7,38 10,44 8 Z" fill="url(#dripGrad)" opacity="0.5"/>
        <path d="M44 72 C44 72,14 52,14 34 C14 24,22 18,30 18 C36 18,41 21,44 26 C47 21,52 18,58 18 C66 18,74 24,74 34 C74 52,44 72,44 72 Z" fill="url(#heartGrad)"/>
        <path d="M44 72 C44 72,14 52,14 34 C14 24,22 18,30 18 C36 18,41 21,44 26 C47 21,52 18,58 18 C66 18,74 24,74 34 C74 52,44 72,44 72 Z" fill="url(#heartShine)"/>
        <path d="M44 66 C44 66,18 49,18 34 C18 26,24 22,30 22 C36 22,41 25,44 30 C47 25,52 22,58 22 C64 22,70 26,70 34 C70 49,44 66,44 66 Z" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="0.8"/>
        <text x="44" y="52" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic" font-weight="400" text-anchor="middle" fill="rgba(210,240,225,0.82)">A</text>
      </svg>
    </div>
    <div class="envelope-address">
      <span class="aly">For Aly</span>
      <span class="date">June 5th</span>
    </div>
    <div class="postmark">
      <div class="postmark-inner">with<br>love</div>
    </div>
  </div>
  <div class="envelope-hint">tap to open</div>
</div>

<div class="letter-overlay" id="letterOverlay">
  <button class="close-btn" onclick="closeLetter()" aria-label="Close letter">&#x2715;</button>
  <div class="letter-page">
    <div class="letter-inner-border"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="letter-content">
      <span class="letter-date">June 5th &nbsp;&mdash;&nbsp; One Month</span>
      <div class="letter-salutation">To Aly,</div>
      <div class="letter-body" id="letterBody">
        <span class="cursor" id="cursor"></span>
      </div>
      <div class="letter-closing" id="letterClosing">
        Yours,
        <span class="name">Anthony</span>
      </div>
      <div class="letter-divider" id="letterDivider"></div>
      <div class="spotify-wrap" id="spotifyWrap">
        <a class="spotify-btn" href="https://open.spotify.com/playlist/1n0woOMQS2g8E4aBiXzWEu?si=057b304c231044bf" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="11" stroke="rgba(15,74,42,0.6)" stroke-width="1.2"/>
            <path d="M7 9.5C9.8 8.2 14.5 8.5 17 10.2" stroke="rgba(15,74,42,0.8)" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M7.5 12.2C9.8 11.1 13.8 11.3 16 12.8" stroke="rgba(15,74,42,0.7)" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M8 14.8C9.8 13.9 13 14.1 15 15.3" stroke="rgba(15,74,42,0.6)" stroke-width="1" stroke-linecap="round"/>
          </svg>
          listen to our playlist
        </a>
        <span class="spotify-label">a little something for you</span>
      </div>
    </div>
  </div>
</div>

<script>
  var paragraphs = [
    "I tell you this every day, and I don’t intend on ever stopping. I’m going to say it again today, but with a little more of my mind behind it.",
    "I love you. I love your voice. I love your laugh. I love the way you talk, the way you see the world. I love your smile. I love how absolutely gorgeous you are. I could go on for so long. I just think you are breathtaking.",
    "The moment we started talking, I felt something I hadn’t quite felt before. This deep sense of being seen. And at the same time, this intense fascination, like I had been searching for something deep down, and I finally found you. Even though we didn’t know each other right away, it felt like we did. There was this light, this magnetism, that I had to explore. And I could just tell you felt the same way.",
    "That feeling is love. But it’s so much more than that, and it continues to grow. That magnetism went from this high, this fire of attraction, and turned into a realization of something deep and passionate. Now it’s evolved into all of that, but with a quiet assuredness underneath it. Because there’s commitment now. To you. To us.",
    "Deep in my body, in my heart, in my whole soul, I feel that you are the love of my life. I want to build a life with you and turn it into something that feels truly ours. You are my north star. You give me hope. You give my life light. You are my world."
  ];

  var CHAR_SPEED = 48;
  var PARA_PAUSE = 700;
  var body = document.getElementById("letterBody");
  var cursor = document.getElementById("cursor");
  var closing = document.getElementById("letterClosing");
  var divider = document.getElementById("letterDivider");
  var spotifyWrap = document.getElementById("spotifyWrap");
  var typingActive = false;

  function spawnParticles() {
    var container = document.getElementById("particles");
    var symbols = ["♥","♡","♦","·","✧"];
    var colors = ["rgba(22,94,54,0.7)","rgba(15,74,42,0.55)","rgba(160,120,48,0.45)","rgba(100,60,140,0.35)","rgba(180,220,200,0.35)"];
    for (var i = 0; i < 22; i++) {
      (function() {
        var p = document.createElement("span");
        p.className = "particle";
        p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        p.style.left = (Math.random() * 100) + "vw";
        p.style.setProperty("--dur", (3.5 + Math.random() * 4) + "s");
        p.style.setProperty("--delay", (Math.random() * 2.5) + "s");
        p.style.color = colors[Math.floor(Math.random() * colors.length)];
        p.style.fontSize = (0.6 + Math.random() * 1) + "rem";
        container.appendChild(p);
        setTimeout(function() { p.remove(); }, 9000);
      })();
    }
  }

  function typeText(text, el, cb) {
    var i = 0;
    function next() {
      if (!typingActive) return;
      if (i < text.length) {
        el.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        var delay = CHAR_SPEED + (Math.random() * 18 - 9);
        if (",;:.!?".indexOf(text[i-1]) !== -1) delay += 160 + Math.random() * 100;
        if (text[i-1] === " " && Math.random() < 0.08) delay += 80;
        setTimeout(next, delay);
      } else { if (cb) cb(); }
    }
    next();
  }

  function typeParagraphs(idx) {
    if (!typingActive) return;
    if (idx >= paragraphs.length) {
      cursor.classList.add("hidden");
      setTimeout(function() {
        closing.classList.add("visible");
        setTimeout(function() {
          divider.classList.add("visible");
          spotifyWrap.classList.add("visible");
        }, 800);
      }, 500);
      return;
    }
    var p = document.createElement("p");
    if (idx === 0) p.className = "drop-cap";
    body.insertBefore(p, cursor);
    p.appendChild(cursor);
    typeText(paragraphs[idx], p, function() {
      body.appendChild(cursor);
      setTimeout(function() { typeParagraphs(idx + 1); }, PARA_PAUSE);
    });
  }

  function startTyping() {
    if (typingActive) return;
    typingActive = true;
    setTimeout(function() { typeParagraphs(0); }, 800);
  }

  function openLetter() {
    var overlay = document.getElementById("letterOverlay");
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
    spawnParticles();
    startTyping();
    setTimeout(function() { overlay.querySelector(".close-btn").focus(); }, 800);
  }

  function closeLetter() {
    typingActive = false;
    var overlay = document.getElementById("letterOverlay");
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(function() {
      if (!overlay.classList.contains("open")) {
        body.innerHTML = "";
        body.appendChild(cursor);
        cursor.classList.remove("hidden");
        closing.classList.remove("visible");
        divider.classList.remove("visible");
        spotifyWrap.classList.remove("visible");
        typingActive = false;
      }
    }, 400);
    document.getElementById("envelope").focus();
  }

  document.getElementById("envelope").addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " ") openLetter();
  });
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeLetter();
  });
</script>
</body>
</html>
